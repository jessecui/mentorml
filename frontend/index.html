<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MentorML | A Multimodal Agentic Learning Companion for AI/ML Concepts</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the theme before first paint so there's no light flash in dark
      // mode: the saved choice from the header toggle, else the system setting.
      // Keep the key in sync with src/lib/theme.ts.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("mentorml:theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
